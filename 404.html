<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Страница не найдена</title>
    <link rel="icon" href="public/icon.ico" sizes="any">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100svh;
            font-family: "Manrope", sans-serif;
            background: #8fd2ff;
            color: #ffffff;
        }

        .error-page {
            position: relative;
            min-height: 100svh;
            overflow: hidden;
            background: linear-gradient(180deg, #7ecfff 0%, #b6e4ff 52%, #ecf9ff 100%);
        }

        .error-page::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(106, 190, 243, 0.08) 0%, rgba(106, 190, 243, 0) 32%, rgba(14, 48, 66, 0.18) 100%),
                linear-gradient(180deg, rgba(255, 255, 255, 0) 56%, rgba(7, 33, 53, 0.52) 100%);
            pointer-events: none;
            z-index: 2;
        }

        .error-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
            z-index: 1;
        }

        .error-background-code {
            position: absolute;
            top: clamp(2rem, 10vw, 5rem);
            left: 50%;
            transform: translateX(-50%);
            z-index: 0;
            margin: 0;
            font-size: clamp(10rem, 34vw, 30rem);
            line-height: 0.8;
            font-weight: 800;
            letter-spacing: 0.08em;
            color: #eef8ff;
            pointer-events: none;
            user-select: none;
            white-space: nowrap;
        }

        .error-content {
            position: absolute;
            left: 50%;
            bottom: clamp(1.5rem, 5vw, 3.5rem);
            transform: translateX(-50%);
            z-index: 3;
            width: min(calc(100% - 2rem), 44rem);
            text-align: center;
            padding: 0 0.5rem;
        }

        .error-text {
            margin: 0 auto;
            max-width: 38rem;
            font-size: clamp(1rem, 2vw, 1.2rem);
            line-height: 1.65;
            font-weight: 700;
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.34);
        }

        .home-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 3.5rem;
            margin-top: 1.25rem;
            padding: 0.95rem 1.8rem;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.86);
            background: rgba(255, 255, 255, 0.18);
            color: #ffffff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 800;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
        }

        .home-link:hover,
        .home-link:focus-visible {
            background: rgba(255, 255, 255, 0.28);
            border-color: #ffffff;
            transform: translateY(-2px);
        }

        .home-link:focus-visible {
            outline: 2px solid #ffffff;
            outline-offset: 3px;
        }

        @media (max-width: 700px) {
            .error-image {
                object-position: center center;
            }

            .error-background-code {
                top: 5.5rem;
                font-size: clamp(7rem, 42vw, 11rem);
                letter-spacing: 0.04em;
            }

            .error-content {
                bottom: 1.25rem;
                width: calc(100% - 1.25rem);
            }

            .error-text {
                max-width: 24rem;
            }

            .home-link {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <main class="error-page">
        <img class="error-image" src="public/404.png" alt="Изображение для страницы 404">
        <div class="error-background-code" aria-hidden="true">404</div>
        <section class="error-content" aria-labelledby="error-message">
            <p class="error-text" id="error-message">Кот съел страницу вместе с бургером. Приятного аппетита!</p>
            <a class="home-link" href="/">Вернуться на главную</a>
        </section>
    </main>
</body>
</html>
