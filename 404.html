<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Страница не найдена</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg-raw: 0, 0, 0;
            --color-text-raw: 255, 255, 255;
            --color-border-raw: 40, 40, 40;
            --color-bg: rgb(var(--color-bg-raw));
            --color-text: rgb(var(--color-text-raw));
            --color-border: rgb(var(--color-border-raw));
            --font-family-base: 'Inter', sans-serif;
            --font-family-display: 'Oswald', sans-serif;
        }
        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: var(--font-family-base);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
        }
        h1 {
            font-family: var(--font-family-display);
            font-size: clamp(4rem, 20vw, 10rem);
            line-height: 1;
            margin: 0;
            text-transform: uppercase;
        }
        p {
            font-size: 1.2rem;
            color: rgba(var(--color-text-raw), 0.7);
            margin: 20px 0 40px;
        }
        a {
            display: inline-block;
            font-size: 1rem;
            font-weight: 500;
            color: var(--color-text);
            text-decoration: none;
            padding: 14px 32px;
            border: 2px solid var(--color-border);
            border-radius: 999px;
            transition: all 0.3s ease;
        }
        a:hover {
            background-color: var(--color-text);
            color: var(--color-bg);
            border-color: var(--color-text);
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>Кажется, такой страницы не существует. Возможно, она была удалена или вы ввели неверный адрес.</p>
        <a href="/">Вернуться на главную</a>
    </div>
</body>
</html>
